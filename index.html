<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elias Winson</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Фон с золотым быком bull.jpg из папки images/ */
            background: linear-gradient(rgba(3, 3, 5, 0.75), rgba(3, 3, 5, 0.85)), 
                        url('bull.jpg') center/cover no-repeat fixed;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 12px;
            text-transform: uppercase;
            color: #f59e0b;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        p {
            color: #d1d5db;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .status {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Elias Winson</h1>
        <p>Innovation & Design Lab</p>
        <span class="status">• SYSTEM UPDATING</span>
    </div>

</body>
</html>
